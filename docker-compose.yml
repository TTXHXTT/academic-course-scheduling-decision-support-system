version: '3.9'

services:
  acs-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - acs_db:/app/db
    environment:
      - DATABASE_URL=sqlite:////app/db/acs.db
      - SECRET_KEY=${SECRET_KEY:-CHANGE_IN_PRODUCTION}
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  acs_db:
